<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - PlacementPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .login-card {
            background: #111;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 255, 255, 0.1);
            animation: fadeIn 0.8s ease-out;
            border: 1px solid #333;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            color: #00ffff;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-label {
            font-size: 14px;
            margin-bottom: 8px;
            color: #ccc;
        }

        .form-control {
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            background: #1a1a1a;
            color: #fff;
        }

        /* Styling the Role Dropdown specifically */
        select.form-control {
            cursor: pointer;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 16px 12px;
            appearance: none;
        }

        .login-btn {
            background: #00ffff;
            color: #000;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #00e6e6;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2 class="login-title">PlacementPro</h2>
    <p class="login-subtitle">Enter the Integrated Career Suite</p>

    <form onsubmit="return loginUser()" id="loginForm">
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input 
                type="email" 
                class="form-control" 
                id="email" 
                placeholder="name@college.edu"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input 
                type="password" 
                class="form-control" 
                id="password" 
                placeholder="••••••••"
                required>
        </div>

        <div class="mb-4">
            <label class="form-label">Access Level</label>
            <select class="form-control" id="role">
                <option value="student">Student Portal</option>
                <option value="admin">Admin (TPO) Control</option>
                <option value="alumni">Alumni Connect</option>
            </select>
        </div>

        <button type="submit" class="btn login-btn w-100">Login</button>
        <!-- place to show login error messages -->
        <div id="loginError" class="text-danger mt-2" style="display:none;"></div>
    </form>
</div>

<script src="assets/js/auth.js"></script>

</body>
</html>
