<!DOCTYPE html>
<html>
<head>
    <title>Visual Scheduler - PlacementPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h3>Interview Control Center</h3> [cite: 8]
            <p class="text-muted">Drag events to reschedule. Overlaps are automatically flagged.</p> 
            <div id="calendar"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridDay',
                editable: true, // Allows dragging 
                events: [
                    { title: 'TCS - Ashik Gowda', start: '2026-02-20T10:00:00', end: '2026-02-20T11:00:00' },
                    { title: 'TCS - Rahul', start: '2026-02-20T11:00:00', end: '2026-02-20T12:00:00' }
                ]
            });
            calendar.render();
        });
    </script>
</body>
</html>
