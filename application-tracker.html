<!DOCTYPE html>
<html>
<head>
    <title>Application Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>

<div class="d-flex">

    <div class="sidebar p-3">
        <h4 class="text-white">Student Panel</h4>
        <a href="dashboard.html">Dashboard</a>
        <a href="application-tracker.html">Application Tracker</a>
    </div>

    <div class="content p-4">
        <h2>Application Tracker</h2>

        <div class="card p-4 shadow mt-4">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>TCS Digital</td>
                        <td><span class="badge bg-warning">Applied</span></td>
                    </tr>
                    <tr>
                        <td>Infosys</td>
                        <td><span class="badge bg-info">Interview Scheduled</span></td>
                    </tr>
                    <tr>
                        <td>Wipro</td>
                        <td><span class="badge bg-success">Selected</span></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

</body>
</html>
