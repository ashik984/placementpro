<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - PlacementPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center">Student Registration</h3>

        <form>
            <input class="form-control mb-3" placeholder="Full Name">
            <input class="form-control mb-3" placeholder="USN">
            <input class="form-control mb-3" placeholder="Branch">
            <input class="form-control mb-3" placeholder="CGPA">
            <input type="email" class="form-control mb-3" placeholder="Email">
            <input type="password" class="form-control mb-3" placeholder="Password">

            <button class="btn btn-success w-100">Register</button>
        </form>
    </div>
</div>

</body>
</html>
