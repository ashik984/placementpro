<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Wizard - PlacementPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar p-3">
        <h4 class="text-white">Student Panel</h4>
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="resume-wizard.html">Resume Wizard</a>
        <a href="application-tracker.html">Application Tracker</a>
        <a href="live-feed.html">Live Feed</a>
    </div>

    <!-- Main Content -->
    <div class="content p-4">
        <h2>Resume Wizard</h2>

        <div class="card p-4 shadow mt-4">
            <form id="resumeForm">

                <input type="text" class="form-control mb-3" id="name" placeholder="Full Name">

                <input type="text" class="form-control mb-3" id="branch" placeholder="Branch">

                <input type="text" class="form-control mb-3" id="cgpa" placeholder="CGPA">

                <textarea class="form-control mb-3" id="skills" placeholder="Skills (comma separated)"></textarea>

                <textarea class="form-control mb-3" id="projects" placeholder="Project Details"></textarea>

                <button type="button" class="btn btn-success w-100" onclick="generateResume()">
                    Generate Resume Preview
                </button>

            </form>
        </div>

        <!-- Resume Preview -->
        <div class="card p-4 shadow mt-4" id="resumePreview" style="display:none;">
            <h3 id="previewName"></h3>
            <p><strong>Branch:</strong> <span id="previewBranch"></span></p>
            <p><strong>CGPA:</strong> <span id="previewCGPA"></span></p>
            <p><strong>Skills:</strong> <span id="previewSkills"></span></p>
            <p><strong>Projects:</strong></p>
            <p id="previewProjects"></p>
        </div>

    </div>

</div>

<script src="../../assets/js/student.js"></script>

</body>
</html>
